<!Doctype html>
<html>
    <head>
        <title>Registration Form</title>
    </head>
    <body>
        
        <center>
            <h1>Form Input Tags</h1>
        
        <hr>
        <br> 
            <h2><mark>Form</mark></h2>
            <br>
        <form>
            <table border="1px" cellspacing="10">
                <tr>
                   
                    <th colspan="2">Student Details</th>
                
                </tr>
                <tr>
                    <td>Name : </td> <td><input type="text" placeholder="Enter Your Name" required></td>
                </tr>

                <tr>
                    <td>Mobile Number : </td> <td><input type="number" placeholder="Enter Your Number" required></td>
                </tr>

                <tr>
                    <td>DOB: </td> <td><input type="date" placeholder="Enter Your Birthdate" required></td>
                </tr>
                
                <tr>
                    <td>Mail-id : </td> <td><input type="email" placeholder="Enter Your Mail" required></td>
                </tr>

                <tr>
                    <td>Password : </td> <td><input type="password" placeholder="Enter Your Password" required></td>
                </tr>

                <tr>
                    <td>URL : </td> <td><input type="url" name="Website" placeholder="Paste Your LinkedIn Profile"></td>
                </tr>

                <tr>
                    <td>Degree : </td>
                    <td>
                        <select>
                            <option>(BE) Bachelor of Engineering </option>
                            <option>(BTech) Bachelor of Technology</option>
                            <option>Diploma</option>
                            <option>MBBS</option>
                            <option >Arts and Science</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>File : </td> <td><input type="file"  placeholder="upload your resume" required></td>
                </tr>


                <tr>
                    <td>Gender : </td> <td><input type="radio" name="Gender">Male <input type="radio" name="Gender">Female</td>
                </tr>
                
                

                <tr>
                    <td>Search : </td> <td><input type="search" name="query"></td>
                </tr>

                <tr>
                    <td>Time : </td> <td><input type="time" name="time"></td>
                </tr>

                <tr>

                        <td><input type="reset"> <input type="submit"></td>
                    
                </tr>
            </table>
        </form>


    </center>

    </body>
</html>
